name: Regression

on:
  pull_request:
  push:
    branches: [ feat/continuity-validator ]

jobs:
  run-regression:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install Pillow

      - name: Run regression
        working-directory: cave-game
        run: |
          python utilities/generate_level_map.py
          python utilities/inject_rules.py
          python utilities/autoplay_route.py


